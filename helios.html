<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Helios – Live Demo</title>

    <!-- Iconify registers <iconify-icon>; ha-shims' <ha-icon> delegates mdi:* to it. -->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>

    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #07090d;
            color: #e6e9ef;
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }

        /* The card fills the entire viewport. */
        #helios-demo-host {
            width: 100vw;
            height: 100vh;
        }
        #helios-demo-host.demo-error {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #ffb3b3;
            font-size: 14px;
            line-height: 1.5;
            background: #160d0d;
        }

        /* Ambient sky panel (top-left): a few quiet sun/moon facts, no clock. */
        #sky-info {
            position: fixed;
            top: 24px;
            left: 28px;
            z-index: 10;
            pointer-events: none;
            user-select: none;
            color: #eef1f6;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            font-variant-numeric: tabular-nums;
        }
        .si-rows { display: flex; flex-direction: column; gap: 8px; }
        .si-row { font-size: 13.5px; color: #c7cedb; letter-spacing: 0.2px; }

        /* Moon glyph shown at night, centred near the top (where the sun sits by day). */
        #moon-glyph {
            position: fixed;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            pointer-events: none;
            user-select: none;
            font-size: clamp(40px, 6vw, 70px);
            line-height: 1;
            filter: drop-shadow(0 0 18px rgba(220, 230, 255, 0.45));
            display: none;
        }
    </style>
</head>
<body class="theme-dark">
    <div id="helios-demo-host"></div>

    <div id="moon-glyph" aria-hidden="true"></div>

    <div id="sky-info" aria-hidden="true">
        <div class="si-rows" id="si-rows"></div>
    </div>

    <!-- 1) HA shims: define <ha-card>/<ha-icon> and inject the HA design tokens. -->
    <script type="module" src="./ha-shims.js"></script>

    <!-- 2) Mount the live demo card (fixed home = Nice, self-hosted bundle, auto-rotating). -->
    <script type="module">
        import { mountHeliosDemo } from './demo-mount.js?v=3';

        const host = document.getElementById('helios-demo-host');

        mountHeliosDemo({
            hostEl:       host,
            initialLang:  'de',
            initialTheme: 'dark',
            // Fixed home location (Nice) so the scene boots there — no geolocation needed.
            initialHome:  { lat: 43.70169894795422, lon: 7.296547293663026 },
            // Self-hosted Helios card (v2026.7.1), committed next to this file.
            bundleUrl:    new URL('./helios.js', import.meta.url).href,
            cacheId:      'helios-hero-demo',
        });

        // Strip the card down to the 3D scene: keep the sun arc and the sunrise/sunset
        // times. Hide every data chip, their leaders, the sun→home ray, the bottom
        // timeline + period bar, the left/right control rails AND the home pill (the
        // green-tinted house already makes "home" obvious). These live inside the card's
        // (open) shadow root, so page CSS can't reach them — inject a stylesheet via
        // adoptedStyleSheets (survives the card's re-renders).
        const HIDE_CSS = `
            .pv-pct-label, .battery-pct-label, .grid-label, .custom-label,
            .solar-pct-label, .cloud-chip, .cloud-chip-leader,
            .pv-home-leader-svg, .grid-leader-svg, .battery-leader-svg,
            .custom-leader-svg, .solar-ray-svg,
            .time-bar, .tb-band,
            .home-pill,
            .overlay-top-left, .overlay-top-right {
                display: none !important;
            }
        `;
        const started = Date.now();
        const iv = setInterval(() => {
            const card = host.querySelector('helios-card');
            if (card && card.shadowRoot) {
                try {
                    const sheet = new CSSStyleSheet();
                    sheet.replaceSync(HIDE_CSS);
                    card.shadowRoot.adoptedStyleSheets = [...card.shadowRoot.adoptedStyleSheets, sheet];
                } catch (e) {
                    const st = document.createElement('style');
                    st.textContent = HIDE_CSS;
                    card.shadowRoot.appendChild(st);
                }
                clearInterval(iv);
            } else if (Date.now() - started > 15000) {
                clearInterval(iv);
            }
        }, 100);
    </script>

    <!-- 3) Ambient sky info: day length, golden hour, the (terrain-aware) sunset, and the
            moon phase + glyph at night. Sun/moon positions come from a compact SunCalc-style
            model (adapted from V. Agafonkin's SunCalc, BSD). The sunrise/sunset are then
            corrected for the observer's real elevation AND the surrounding hills, using a
            terrain skyline ray-cast from the Open-Meteo elevation API. -->
    <script type="module">
        const HOME = { lat: 43.70169894795422, lon: 7.296547293663026 };

        /* ---- SunCalc-style sun + moon model (radians throughout) ---- */
        const PI = Math.PI, rad = PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
        const toJulian   = d => d.valueOf() / dayMs - 0.5 + J1970;
        const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
        const toDays     = d => toJulian(d) - J2000;
        const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
        const declination    = (l, b) => Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
        const azimuth  = (H, phi, dec) => Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
        const altitude = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
        const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;
        const solarMeanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
        const eclipticLongitude = M => {
            const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
            return M + C + rad * 102.9372 + PI;
        };
        const sunCoords = d => { const M = solarMeanAnomaly(d), L = eclipticLongitude(M); return { dec: declination(L, 0), ra: rightAscension(L, 0) }; };
        const getPosition = (date, lat, lng) => {
            const lw = rad * -lng, phi = rad * lat, d = toDays(date), c = sunCoords(d), H = siderealTime(d, lw) - c.ra;
            return { azimuth: azimuth(H, phi, c.dec), altitude: altitude(H, phi, c.dec) };
        };
        const J0 = 0.0009;
        const approxTransit = (Ht, lw, n) => J0 + (Ht + lw) / (2 * PI) + n;
        const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
        const hourAngle = (h, phi, d) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d)));
        const julianCycle = (d, lw) => Math.round(d - J0 - lw / (2 * PI));
        const getSetJ = (h, lw, phi, dec, n, M, L) => solarTransitJ(approxTransit(hourAngle(h, phi, dec), lw, n), M, L);
        function getTimes(date, lat, lng) {
            const lw = rad * -lng, phi = rad * lat, d = toDays(date), n = julianCycle(d, lw), ds = approxTransit(0, lw, n),
                  M = solarMeanAnomaly(ds), L = eclipticLongitude(M), dec = declination(L, 0), Jnoon = solarTransitJ(ds, M, L);
            const Jset = getSetJ(0, lw, phi, dec, n, M, L), Jrise = Jnoon - (Jset - Jnoon);
            const Jgold = getSetJ(6 * rad, lw, phi, dec, n, M, L);
            return { solarNoon: fromJulian(Jnoon), sunrise: fromJulian(Jrise), sunset: fromJulian(Jset), goldenHour: fromJulian(Jgold) };
        }
        const moonCoords = d => {
            const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d),
                  l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F), dt = 385001 - 20905 * Math.cos(M);
            return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
        };
        function getMoonIllumination(date) {
            const d = toDays(date), s = sunCoords(d), m = moonCoords(d), sdist = 149598000,
                  phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra)),
                  inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi)),
                  angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
                                     Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
            return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / PI };
        }
        function moonName(p) {
            if (p < 0.03 || p > 0.97) return ['🌑', 'New moon'];
            if (p < 0.22) return ['🌒', 'Waxing crescent'];
            if (p < 0.28) return ['🌓', 'First quarter'];
            if (p < 0.47) return ['🌔', 'Waxing gibbous'];
            if (p < 0.53) return ['🌕', 'Full moon'];
            if (p < 0.72) return ['🌖', 'Waning gibbous'];
            if (p < 0.78) return ['🌗', 'Last quarter'];
            return ['🌘', 'Waning crescent'];
        }

        /* ---- Terrain-aware sunrise/sunset (observer height + the hills) ---- */
        const R_EFF = 6371000 / 0.87;        // Earth radius inflated for atmospheric refraction (k≈0.13)
        const SUN_RADIUS = 0.2666 * rad;     // angular radius of the solar disc
        let homeElev = 100;                  // metres; refined from the elevation API on load
        const refractionRad = hDeg => {      // Bennett's apparent-refraction formula → radians
            const h = Math.max(hDeg, -1);
            return (1.02 / Math.tan((h + 10.3 / (h + 5.11)) * rad)) / 60 * rad;
        };
        // Sun bearing in degrees from North (SunCalc azimuth is measured from South).
        const sunBearingDeg = date => (getPosition(date, HOME.lat, HOME.lon).azimuth * 180 / PI + 180 + 360) % 360;

        // Max skyline elevation angle (radians) along a compass bearing, from the home.
        async function horizonAlongBearing(bearingDeg) {
            const b = bearingDeg * rad, cosB = Math.cos(b), sinB = Math.sin(b);
            const dLat = 1 / 111320, dLon = 1 / (111320 * Math.cos(HOME.lat * rad));
            // Start at 300 m: the coarse (~90 m) DEM and the home's own slope make the
            // first 100–200 m unreliable; "behind the hills" means the ridges beyond.
            const dists = [];
            for (let d = 300;  d <= 1500;  d += 150)  dists.push(d);
            for (let d = 1750; d <= 5000;  d += 250)  dists.push(d);
            for (let d = 5500; d <= 15000; d += 500)  dists.push(d);
            for (let d = 16000; d <= 25000; d += 1000) dists.push(d);
            const lats = dists.map(d => (HOME.lat + d * cosB * dLat).toFixed(5));
            const lons = dists.map(d => (HOME.lon + d * sinB * dLon).toFixed(5));
            const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats.join(',')}&longitude=${lons.join(',')}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('elevation http ' + res.status);
            const el = (await res.json()).elevation;
            const eye = homeElev + 2;
            let maxAng = -Infinity;
            for (let i = 0; i < dists.length; i++) {
                const z = el[i];
                if (typeof z !== 'number') continue;
                const drop = dists[i] * dists[i] / (2 * R_EFF);   // earth-curvature drop, refraction-corrected
                const ang = Math.atan2(z - eye - drop, dists[i]);
                if (ang > maxAng) maxAng = ang;
            }
            const dipSea = -Math.sqrt(2 * homeElev / R_EFF);       // never higher (sun-side) than the depressed sea horizon
            return Math.max(maxAng, dipSea);
        }

        // Time on `date` when the sun's true centre altitude meets the apparent skyline.
        function solveCrossing(date, skylineRad, evening) {
            const noon = getTimes(date, HOME.lat, HOME.lon).solarNoon.getTime();
            const target = skylineRad - refractionRad(skylineRad * 180 / PI) - SUN_RADIUS;
            let lo = evening ? noon : noon - 12 * 3600000;
            let hi = evening ? noon + 12 * 3600000 : noon;
            for (let i = 0; i < 42; i++) {
                const mid = (lo + hi) / 2;
                const alt = getPosition(new Date(mid), HOME.lat, HOME.lon).altitude;
                const ahead = evening ? (alt > target) : (alt < target);
                if (ahead) lo = mid; else hi = mid;
            }
            return new Date((lo + hi) / 2);
        }

        async function terrainEvent(date, evening) {
            const g = getTimes(date, HOME.lat, HOME.lon);
            let t = evening ? g.sunset : g.sunrise;
            let bearing = sunBearingDeg(t);
            for (let iter = 0; iter < 3; iter++) {
                const sky = await horizonAlongBearing(bearing);
                t = solveCrossing(date, sky, evening);
                const b2 = sunBearingDeg(t);
                const diff = Math.abs(((b2 - bearing + 540) % 360) - 180);
                bearing = b2;
                if (diff < 0.6) break;
            }
            return t;
        }

        /* ---- Render ---- */
        const pad = n => String(n).padStart(2, '0');
        const hm  = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
        const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; };
        const row = txt => `<div class="si-row">${txt}</div>`;
        const elRows = document.getElementById('si-rows');
        const elMoon = document.getElementById('moon-glyph');

        const terr = { key: '', sunrise: null, sunset: null };
        let terrInflight = false, terrCooldown = 0;

        function render() {
            const now = new Date();
            const g = getTimes(now, HOME.lat, HOME.lon);
            const sunrise = terr.sunrise || g.sunrise;
            const sunset  = terr.sunset  || g.sunset;
            const isDay = now >= sunrise && now <= sunset;

            const rows = [row('Day length ' + dur(sunset - sunrise))];
            if (isDay) {
                rows.push(row('Golden hour ' + hm(g.goldenHour)));
                rows.push(row('Sunset ' + hm(sunset)));
                elMoon.style.display = 'none';
            } else {
                const mi = getMoonIllumination(now), nm = moonName(mi.phase)[1];
                rows.push(row(nm + ' · ' + Math.round(mi.fraction * 100) + ' %'));
                const nextRise = now < sunrise ? sunrise : getTimes(new Date(now.getTime() + dayMs), HOME.lat, HOME.lon).sunrise;
                rows.push(row('Sunrise ' + hm(nextRise)));
                elMoon.textContent = moonName(mi.phase)[0];
                elMoon.style.display = 'block';
            }
            elRows.innerHTML = rows.join('');
        }

        async function ensureTerrain() {
            const key = new Date().toDateString();
            if (terr.key === key && terr.sunset) return;     // already have today's
            if (terrInflight || Date.now() < terrCooldown) return;
            terrInflight = true;
            try {
                const r0 = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${HOME.lat}&longitude=${HOME.lon}`);
                if (r0.ok) { const e0 = (await r0.json()).elevation; if (Array.isArray(e0) && typeof e0[0] === 'number') homeElev = e0[0]; }
                const today = new Date();
                const g = getTimes(today, HOME.lat, HOME.lon);
                // Terrain correction for SUNSET only — that's the "sun behind the western
                // hills" case. Sunrise stays astronomical (the eastern slope the house sits
                // on makes a near-field terrain sunrise unreliable).
                let ss = await terrainEvent(today, true);
                if (Math.abs(ss - g.sunset) > 90 * 60000) ss = g.sunset;   // guard against artefacts
                terr.key = key; terr.sunrise = null; terr.sunset = ss;
                if (window.__sky) window.__sky.terrain = { homeElev, sunset: ss, geomSunset: g.sunset };
                render();
            } catch (err) {
                terrCooldown = Date.now() + 60000;           // back off a minute; geometric times shown meanwhile
                if (window.__sky) window.__sky.terrainError = String(err);
            } finally {
                terrInflight = false;
            }
        }

        render();
        ensureTerrain();
        setInterval(() => { render(); ensureTerrain(); }, 1000);
        window.__sky = { getTimes, getPosition, getMoonIllumination, moonName, horizonAlongBearing, terrainEvent };
    </script>
</body>
</html>
