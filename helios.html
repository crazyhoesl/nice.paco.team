<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Helios – Live Demo</title>

    <!-- Iconify registers <iconify-icon>; ha-shims' <ha-icon> delegates mdi:* to it. -->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>

    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #07090d;
            color: #e6e9ef;
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }

        /* The card fills the entire viewport. */
        #helios-demo-host { width: 100vw; height: 100vh; }
        #helios-demo-host.demo-error {
            display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center; color: #ffb3b3;
            font-size: 14px; line-height: 1.5; background: #160d0d;
        }

        /* Ambient sky panel (top-left): a few quiet sun/moon facts, no clock. */
        #sky-info {
            position: fixed; top: 24px; left: 28px; z-index: 10;
            pointer-events: none; user-select: none;
            color: #eef1f6; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            font-variant-numeric: tabular-nums;
        }
        .si-rows { display: flex; flex-direction: column; gap: 8px; }
        .si-row { font-size: 13.5px; color: #c7cedb; letter-spacing: 0.2px; }
    </style>
</head>
<body class="theme-dark">
    <div id="helios-demo-host"></div>

    <div id="sky-info" aria-hidden="true">
        <div class="si-rows" id="si-rows"></div>
    </div>

    <!-- 1) HA shims: define <ha-card>/<ha-icon> and inject the HA design tokens. -->
    <script type="module" src="./ha-shims.js"></script>

    <!-- 2) Mount the live demo card (fixed home = Nice, self-hosted bundle, auto-rotating). -->
    <script type="module">
        import { mountHeliosDemo } from './demo-mount.js?v=3';

        const host = document.getElementById('helios-demo-host');

        mountHeliosDemo({
            hostEl:       host,
            initialLang:  'de',
            initialTheme: 'dark',
            initialHome:  { lat: 43.70169894795422, lon: 7.296547293663026 },
            bundleUrl:    new URL('./helios.js', import.meta.url).href,
            cacheId:      'helios-hero-demo',
        });

        // Strip the card to the 3D scene. We also hide the card's own sun-cross markers
        // (.sun-cross-marker) and draw our own at the TERRAIN sunrise/sunset positions
        // (see script 3), so the arc labels match the panel.
        const HIDE_CSS = `
            .pv-pct-label, .battery-pct-label, .grid-label, .custom-label,
            .solar-pct-label, .cloud-chip, .cloud-chip-leader,
            .pv-home-leader-svg, .grid-leader-svg, .battery-leader-svg,
            .custom-leader-svg, .solar-ray-svg,
            .time-bar, .tb-band,
            .home-pill, .sun-cross-marker,
            .overlay-top-left, .overlay-top-right {
                display: none !important;
            }
        `;
        const started = Date.now();
        const iv = setInterval(() => {
            const card = host.querySelector('helios-card');
            if (card && card.shadowRoot) {
                try {
                    const sheet = new CSSStyleSheet();
                    sheet.replaceSync(HIDE_CSS);
                    card.shadowRoot.adoptedStyleSheets = [...card.shadowRoot.adoptedStyleSheets, sheet];
                } catch (e) {
                    const st = document.createElement('style');
                    st.textContent = HIDE_CSS;
                    card.shadowRoot.appendChild(st);
                }
                clearInterval(iv);
            } else if (Date.now() - started > 15000) {
                clearInterval(iv);
            }
        }, 100);
    </script>

    <!-- 3) Sky model + panel + scene overlay:
            • day length / golden hour / (terrain) sunset, moon phase at night
            • terrain-aware sunrise AND sunset (observer at 100 m + the surrounding hills)
            • the moon's orbit + disc, projected into the scene with the card's own
              _projectScenePoint (the same projection the sun arc uses), re-projected each frame
            • our own sunrise/sunset arc markers at the terrain-crossing sun positions -->
    <script type="module">
        const HOME = { lat: 43.70169894795422, lon: 7.296547293663026 };
        const EYE  = 100;   // observer eye height in metres (top floor — fixed per Patrick)

        /* ---------- SunCalc-style sun + moon model (radians) ---------- */
        const PI = Math.PI, rad = PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
        const toJulian   = d => d.valueOf() / dayMs - 0.5 + J1970;
        const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
        const toDays     = d => toJulian(d) - J2000;
        const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
        const declination    = (l, b) => Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
        const azimuth  = (H, phi, dec) => Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
        const altitude = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
        const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;
        const solarMeanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
        const eclipticLongitude = M => {
            const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
            return M + C + rad * 102.9372 + PI;
        };
        const sunCoords = d => { const M = solarMeanAnomaly(d), L = eclipticLongitude(M); return { dec: declination(L, 0), ra: rightAscension(L, 0) }; };
        const getPosition = (date, lat, lng) => {
            const lw = rad * -lng, phi = rad * lat, d = toDays(date), c = sunCoords(d), H = siderealTime(d, lw) - c.ra;
            return { azimuth: azimuth(H, phi, c.dec), altitude: altitude(H, phi, c.dec) };
        };
        const J0 = 0.0009;
        const approxTransit = (Ht, lw, n) => J0 + (Ht + lw) / (2 * PI) + n;
        const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
        const hourAngle = (h, phi, d) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d)));
        const julianCycle = (d, lw) => Math.round(d - J0 - lw / (2 * PI));
        const getSetJ = (h, lw, phi, dec, n, M, L) => solarTransitJ(approxTransit(hourAngle(h, phi, dec), lw, n), M, L);
        function getTimes(date, lat, lng) {
            const lw = rad * -lng, phi = rad * lat, d = toDays(date), n = julianCycle(d, lw), ds = approxTransit(0, lw, n),
                  M = solarMeanAnomaly(ds), L = eclipticLongitude(M), dec = declination(L, 0), Jnoon = solarTransitJ(ds, M, L);
            const Jset = getSetJ(0, lw, phi, dec, n, M, L), Jrise = Jnoon - (Jset - Jnoon);
            const Jgold = getSetJ(6 * rad, lw, phi, dec, n, M, L);
            return { solarNoon: fromJulian(Jnoon), sunrise: fromJulian(Jrise), sunset: fromJulian(Jset), goldenHour: fromJulian(Jgold) };
        }
        const moonCoords = d => {
            const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d),
                  l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F), dt = 385001 - 20905 * Math.cos(M);
            return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
        };
        function getMoonIllumination(date) {
            const d = toDays(date), s = sunCoords(d), m = moonCoords(d), sdist = 149598000,
                  phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra)),
                  inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi)),
                  angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
                                     Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
            return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / PI };
        }
        const moonName = p =>
            (p < 0.03 || p > 0.97) ? 'New moon'
            : p < 0.22 ? 'Waxing crescent' : p < 0.28 ? 'First quarter'
            : p < 0.47 ? 'Waxing gibbous'  : p < 0.53 ? 'Full moon'
            : p < 0.72 ? 'Waning gibbous'  : p < 0.78 ? 'Last quarter' : 'Waning crescent';
        // Moon horizon position: altitude (rad) and azimuth measured from NORTH (rad).
        function moonPosition(date) {
            const lw = rad * -HOME.lon, phi = rad * HOME.lat, d = toDays(date), m = moonCoords(d), H = siderealTime(d, lw) - m.ra;
            return { alt: altitude(H, phi, m.dec), azN: azimuth(H, phi, m.dec) + PI };
        }

        /* ---------- Terrain-aware sunrise/sunset (eye height + the hills) ---------- */
        const R_EFF = 6371000 / 0.87;
        const SUN_RADIUS = 0.2666 * rad;
        const refractionRad = hDeg => { const h = Math.max(hDeg, -1); return (1.02 / Math.tan((h + 10.3 / (h + 5.11)) * rad)) / 60 * rad; };
        const sunBearingDeg = date => (getPosition(date, HOME.lat, HOME.lon).azimuth * 180 / PI + 180 + 360) % 360;

        async function horizonAlongBearing(bearingDeg) {
            const b = bearingDeg * rad, cosB = Math.cos(b), sinB = Math.sin(b);
            const dLat = 1 / 111320, dLon = 1 / (111320 * Math.cos(HOME.lat * rad));
            const dists = [];
            for (let d = 300;  d <= 1500;  d += 150)  dists.push(d);   // skip <300 m: coarse DEM + own slope
            for (let d = 1750; d <= 5000;  d += 250)  dists.push(d);
            for (let d = 5500; d <= 15000; d += 500)  dists.push(d);
            for (let d = 16000; d <= 25000; d += 1000) dists.push(d);
            const lats = dists.map(d => (HOME.lat + d * cosB * dLat).toFixed(5));
            const lons = dists.map(d => (HOME.lon + d * sinB * dLon).toFixed(5));
            const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats.join(',')}&longitude=${lons.join(',')}`);
            if (!res.ok) throw new Error('elevation http ' + res.status);
            const el = (await res.json()).elevation;
            let maxAng = -Infinity;
            for (let i = 0; i < dists.length; i++) {
                const z = el[i]; if (typeof z !== 'number') continue;
                const drop = dists[i] * dists[i] / (2 * R_EFF);
                const ang = Math.atan2(z - EYE - drop, dists[i]);
                if (ang > maxAng) maxAng = ang;
            }
            return Math.max(maxAng, -Math.sqrt(2 * EYE / R_EFF));
        }
        function solveCrossing(date, skylineRad, evening) {
            const noon = getTimes(date, HOME.lat, HOME.lon).solarNoon.getTime();
            const target = skylineRad - refractionRad(skylineRad * 180 / PI) - SUN_RADIUS;
            let lo = evening ? noon : noon - 12 * 3600000, hi = evening ? noon + 12 * 3600000 : noon;
            for (let i = 0; i < 42; i++) {
                const mid = (lo + hi) / 2;
                const alt = getPosition(new Date(mid), HOME.lat, HOME.lon).altitude;
                if (evening ? (alt > target) : (alt < target)) lo = mid; else hi = mid;
            }
            return new Date((lo + hi) / 2);
        }
        async function terrainEvent(date, evening) {
            const g = getTimes(date, HOME.lat, HOME.lon);
            let t = evening ? g.sunset : g.sunrise, bearing = sunBearingDeg(t);
            for (let iter = 0; iter < 3; iter++) {
                const sky = await horizonAlongBearing(bearing);
                t = solveCrossing(date, sky, evening);
                const b2 = sunBearingDeg(t), diff = Math.abs(((b2 - bearing + 540) % 360) - 180);
                bearing = b2;
                if (diff < 0.6) break;
            }
            return t;
        }

        /* ---------- Panel ---------- */
        const pad = n => String(n).padStart(2, '0');
        const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
        const hmCard = d => d.getHours() + ':' + pad(d.getMinutes());   // card label style, e.g. "5:56"
        const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; };
        const rowHtml = txt => `<div class="si-row">${txt}</div>`;
        const elRows = document.getElementById('si-rows');

        const terr = { key: '', sunrise: null, sunset: null };
        let terrInflight = false, terrCooldown = 0;

        function render() {
            const now = new Date(), g = getTimes(now, HOME.lat, HOME.lon);
            const sunrise = terr.sunrise || g.sunrise, sunset = terr.sunset || g.sunset;
            const isDay = now >= sunrise && now <= sunset;
            const rows = [rowHtml('Day length ' + dur(sunset - sunrise))];
            if (isDay) {
                rows.push(rowHtml('Golden hour ' + hm(g.goldenHour)));
                rows.push(rowHtml('Sunset ' + hm(sunset)));
            } else {
                const mi = getMoonIllumination(now);
                rows.push(rowHtml(moonName(mi.phase) + ' · ' + Math.round(mi.fraction * 100) + ' %'));
                const nextRise = now < sunrise ? sunrise : (terr.sunrise || getTimes(new Date(now.getTime() + dayMs), HOME.lat, HOME.lon).sunrise);
                rows.push(rowHtml('Sunrise ' + hm(nextRise)));
            }
            elRows.innerHTML = rows.join('');
        }
        async function ensureTerrain() {
            const key = new Date().toDateString();
            if (terr.key === key && terr.sunset) return;
            if (terrInflight || Date.now() < terrCooldown) return;
            terrInflight = true;
            try {
                const today = new Date(), g = getTimes(today, HOME.lat, HOME.lon);
                let sr = await terrainEvent(today, false);
                let ss = await terrainEvent(today, true);
                if (Math.abs(sr - g.sunrise) > 180 * 60000) sr = g.sunrise;   // guard against artefacts
                if (Math.abs(ss - g.sunset)  > 90  * 60000) ss = g.sunset;
                terr.key = key; terr.sunrise = sr; terr.sunset = ss;
                if (window.__sky) window.__sky.terrain = { sunrise: sr, sunset: ss, geom: { sunrise: g.sunrise, sunset: g.sunset } };
                render();
            } catch (err) {
                terrCooldown = Date.now() + 60000;
                if (window.__sky) window.__sky.terrainError = String(err);
            } finally { terrInflight = false; }
        }

        /* ---------- Scene overlay: moon orbit + disc, terrain sun markers ---------- */
        const SVGNS = 'http://www.w3.org/2000/svg';
        const eng = () => window.__heliosEngine;
        const safe = fn => { try { return fn(); } catch (e) { return null; } };

        // Place body on the card's sky dome (radius 40·arcScale m) and project to screen px.
        function project(E, azN, alt) {
            const c = 40 * E._sunArcScale(), cl = Math.cos(alt);
            const east = c * cl * Math.sin(azN), north = c * cl * Math.cos(azN), h = c * Math.sin(alt);
            const lon = E.homeLon + east / (111320 * Math.cos(E.homeLat * rad)), lat = E.homeLat + north / 111320;
            const p = E._projectScenePoint(lon, lat, h);
            return p ? { x: p.x, y: p.y, alt } : null;
        }
        const projMoonAt = (E, date) => { const m = moonPosition(date); return project(E, m.azN, m.alt); };
        function projSunAt(E, date) {                 // sun screen pos at an arbitrary time (terrain markers)
            const sp = E._sunSpherePoint(date); if (!sp) return null;
            const pr = E._projectScenePoint(sp.lon, sp.lat, sp.altitudeM);
            return pr ? { x: pr.x, y: pr.y } : null;
        }

        // The overlay lives at PAGE level (not inside the card) so the card's Lit
        // re-renders can't wipe it. The card's projection returns pixels relative to
        // the ha-card box; we add ha-card's page offset each frame to map into page px.
        const haCardEl = () => {
            const card = document.getElementById('helios-demo-host').querySelector('helios-card');
            return card && card.shadowRoot && card.shadowRoot.querySelector('ha-card');
        };
        let layer, orbitAbove, orbitBelow, moonGlow, moonDisc, riseMark, setMark, built = false;
        function mkMarker(icon) {
            const d = document.createElement('div');
            d.style.cssText = 'position:fixed;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:3px;color:#ffc107;pointer-events:none;font:600 12px/1 Inter,Roboto,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.85);z-index:9;';
            d.innerHTML = `<iconify-icon icon="${icon}" style="font-size:16px"></iconify-icon><span class="t"></span>`;
            document.body.appendChild(d);
            return d;
        }
        function buildOverlay() {
            if (built) return;
            layer = document.createElementNS(SVGNS, 'svg');
            layer.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;overflow:visible;pointer-events:none;z-index:8;';
            orbitBelow = document.createElementNS(SVGNS, 'path');   // just-below-horizon: same dash, fainter
            orbitBelow.setAttribute('fill', 'none'); orbitBelow.setAttribute('stroke', 'rgba(174,202,243,0.28)');
            orbitBelow.setAttribute('stroke-width', '1.2'); orbitBelow.setAttribute('stroke-dasharray', '4 5'); orbitBelow.setAttribute('stroke-linecap', 'round');
            orbitAbove = document.createElementNS(SVGNS, 'path');
            orbitAbove.setAttribute('fill', 'none'); orbitAbove.setAttribute('stroke', 'rgba(174,202,243,0.55)');
            orbitAbove.setAttribute('stroke-width', '1.4'); orbitAbove.setAttribute('stroke-dasharray', '4 5'); orbitAbove.setAttribute('stroke-linecap', 'round');
            moonGlow = document.createElementNS(SVGNS, 'circle'); moonGlow.setAttribute('r', '16'); moonGlow.setAttribute('fill', 'rgba(176,202,244,0.20)');
            moonDisc = document.createElementNS(SVGNS, 'circle'); moonDisc.setAttribute('r', '9'); moonDisc.setAttribute('fill', '#dfe7f5');
            layer.append(orbitBelow, orbitAbove, moonGlow, moonDisc);
            document.body.appendChild(layer);
            riseMark = mkMarker('mdi:weather-sunset-up'); setMark = mkMarker('mdi:weather-sunset-down');
            built = true;
        }

        // The moon's daily orbit is camera-independent; cache its dome points, re-project per frame.
        let orbitCache = { key: '', pts: [] };
        function ensureOrbitCache(E) {
            const start = new Date(); start.setHours(0, 0, 0, 0);
            const key = start.toDateString() + '|' + Math.round(E._sunArcScale() * 100);
            if (orbitCache.key === key) return;
            const N = 96, step = dayMs / N, pts = [];
            for (let i = 0; i <= N; i++) { const m = moonPosition(new Date(start.getTime() + i * step)); pts.push({ azN: m.azN, alt: m.alt }); }
            orbitCache = { key, pts };
        }
        const ok = v => v && isFinite(v.x) && isFinite(v.y) && Math.abs(v.x) < 20000 && Math.abs(v.y) < 20000;
        function drawOrbit(E, ox, oy) {
            ensureOrbitCache(E);
            let dA = '', dB = '', penA = false, penB = false;
            for (const q of orbitCache.pts) {
                if (q.alt < -0.21) { penA = penB = false; continue; }   // skip deep-below (~-12°): keep it sky-bound
                const p = project(E, q.azN, q.alt);
                if (!ok(p)) { penA = penB = false; continue; }
                const xy = (ox + p.x).toFixed(1) + ' ' + (oy + p.y).toFixed(1);
                if (q.alt > 0) { dA += (penA ? 'L' : 'M') + xy + ' '; penA = true; penB = false; }
                else           { dB += (penB ? 'L' : 'M') + xy + ' '; penB = true; penA = false; }
            }
            orbitAbove.setAttribute('d', dA); orbitBelow.setAttribute('d', dB);
        }
        function drawDisc(E, ox, oy) {
            const p = projMoonAt(E, new Date());
            const show = ok(p) && p.alt > 0;
            for (const el of [moonDisc, moonGlow]) el.style.display = show ? '' : 'none';
            if (show) for (const el of [moonDisc, moonGlow]) { el.setAttribute('cx', (ox + p.x).toFixed(1)); el.setAttribute('cy', (oy + p.y).toFixed(1)); }
        }
        function placeMarker(mark, pt, txt, ox, oy) {
            if (ok(pt)) { mark.style.left = (ox + pt.x).toFixed(1) + 'px'; mark.style.top = (oy + pt.y).toFixed(1) + 'px'; mark.style.display = 'flex'; mark.querySelector('.t').textContent = txt; }
            else mark.style.display = 'none';
        }
        function drawMarkers(E, ox, oy) {
            const g = getTimes(new Date(), HOME.lat, HOME.lon);
            const sr = terr.sunrise || g.sunrise, ss = terr.sunset || g.sunset;
            placeMarker(riseMark, projSunAt(E, sr), hmCard(sr), ox, oy);
            placeMarker(setMark,  projSunAt(E, ss), hmCard(ss), ox, oy);
        }

        let lastB = null, lastMin = -1, lastRect = '';
        function paint() {
            const E = eng(), hc = haCardEl();
            if (!(E && E._renderer && hc)) return;
            buildOverlay();
            const r = hc.getBoundingClientRect(), ox = r.left, oy = r.top;
            const b = safe(() => E.getCameraBearing());
            const min = Math.floor(Date.now() / 60000);
            const rk = Math.round(ox) + 'x' + Math.round(oy) + 'x' + Math.round(r.width);
            if (b !== lastB || min !== lastMin || rk !== lastRect) {
                drawOrbit(E, ox, oy); drawDisc(E, ox, oy); drawMarkers(E, ox, oy);
                lastB = b; lastMin = min; lastRect = rk;
            }
        }
        // rAF paints smoothly while the tab is visible; the interval keeps it alive
        // (and buildable) even when the tab is backgrounded and rAF is paused.
        function frame() { paint(); requestAnimationFrame(frame); }

        render();
        ensureTerrain();
        setInterval(() => { render(); ensureTerrain(); paint(); }, 1000);
        requestAnimationFrame(frame);
        window.__sky = { getTimes, getPosition, getMoonIllumination, moonName, moonPosition, terrainEvent, project, projMoonAt, paint };
    </script>
</body>
</html>
