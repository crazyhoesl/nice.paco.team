<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Rotation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    iframe { width: 100vw; height: 100vh; border: none; }
    .status {
      color: #555;
      font-family: sans-serif;
    }
    .status.error { color: #a33; }
  </style>
</head>
<body>
  <div class="status" id="status">Lade Webcams…</div>
  <iframe id="webcamFrame" src="" allow="autoplay; encrypted-media" allowfullscreen style="display:none"></iframe>
  <script>
    const WORKER_URL = "webcams.json";
    const DEFAULT_DURATION = 95000; // fallback when an item has no `duration`

    // The Helios scene always opens the rotation. No `duration` → uses DEFAULT_DURATION,
    // i.e. the same timer as the webcam videos. Defined here (not in webcams.json) so the
    // index.html grid stays unchanged.
    const HELIOS = { name: "helios", url: "helios.html" };

    function toEmbedUrl(url) {
      const match = url.match(/youtube\.com\/watch\?v=([^&]+)/);
      if (match) return `https://www.youtube.com/embed/${match[1]}?autoplay=1&mute=1`;
      if (url.includes("youtube.com/embed/") && !url.includes("autoplay")) {
        return `${url}${url.includes("?") ? "&" : "?"}autoplay=1&mute=1`;
      }
      return url;
    }

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // The PPDF widget closes each loop.
    function isPdf(item) {
      return /ppdf/i.test(item.name || "") || /ppdf/i.test(item.url || "");
    }

    async function startRotation() {
      try {
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const all = await res.json();
        const rotation = all.filter((c) => c.rotation);
        const pdf = rotation.find(isPdf) || null;
        const videos = rotation.filter((c) => !isPdf(c));

        document.getElementById("status").remove();
        const frame = document.getElementById("webcamFrame");
        frame.style.display = "block";

        // One loop = Helios → videos (shuffled) → PDF. Rebuilt every loop so Helios always
        // starts, the videos get re-shuffled, and the PDF always comes last.
        function buildSequence() {
          const seq = [HELIOS, ...shuffle(videos)];
          if (pdf) seq.push(pdf);
          return seq;
        }

        let sequence = buildSequence();
        let index = 0;

        function next() {
          const current = sequence[index];
          frame.src = toEmbedUrl(current.url);
          const duration = Number(current.duration) > 0 ? Number(current.duration) : DEFAULT_DURATION;
          index++;
          if (index >= sequence.length) {
            index = 0;
            sequence = buildSequence();
          }
          setTimeout(next, duration);
        }

        next();
      } catch (err) {
        const el = document.getElementById("status");
        el.className = "status error";
        el.textContent = `Fehler: ${err.message}`;
      }
    }

    startRotation();
  </script>
</body>
</html>
